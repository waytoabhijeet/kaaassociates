<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KAA Admin Login</title>
  <style>
    :root {
      --navy: #0d1b2a;
      --navy-2: #112c4b;
      --teal: #16a085;
      --bg: #f3f7fb;
      --card: #ffffff;
      --text: #1a2433;
      --muted: #61718a;
      --line: #dfeaf5;
      --danger: #d84c4c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.5 "Inter", system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #eef7ff 0%, #f5f8fc 35%, #edfaf6 100%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .login-shell {
      width: min(460px, 100%);
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: 0 26px 60px rgba(13,27,42,0.14);
      overflow: hidden;
    }
    .login-top {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 68%, #16365a 100%);
      color: #fff;
      padding: 28px 28px 22px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--teal), #11b7a6);
      color: #fff;
      font-size: 1rem;
      box-shadow: 0 10px 22px rgba(22, 160, 133, 0.26);
    }
    .login-form {
      padding: 28px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.9rem, 4vw, 2.4rem);
      letter-spacing: -0.06em;
      color: var(--navy);
    }
    .subtitle {
      color: var(--muted);
      margin: 0 0 22px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }
    label {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--navy);
    }
    input {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      color: var(--text);
    }
    input:focus {
      outline: none;
      border-color: rgba(22,160,133,0.52);
      box-shadow: 0 0 0 4px rgba(22,160,133,0.12);
    }
    .btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--teal), #0fa7b8);
      color: #fff;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(22,160,133,0.24);
    }
    .error {
      min-height: 22px;
      margin-top: 12px;
      color: var(--danger);
      font-size: 0.9rem;
      font-weight: 600;
    }
    .meta {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="login-top">
      <div class="brand"><span class="brand-mark">K</span> KAA Associates</div>
    </div>
    <div class="login-form">
      <h1>Admin login</h1>
      <p class="subtitle">Access lead enquiries and admin tools.</p>

      <form id="loginForm">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" value="admin" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter password" required>
        </div>

        <button class="btn" type="submit">Login</button>
        <div id="error" class="error" aria-live="polite"></div>
      </form>

      <div class="meta">Use the same credentials set in your environment as ADMIN_USER / ADMIN_PASSWORD.</div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const error = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';

      const payload = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      };

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        window.location.href = '/admin';
      } catch (err) {
        error.textContent = err.message || 'Invalid username or password';
      }
    });
  </script>
</body>
</html>
